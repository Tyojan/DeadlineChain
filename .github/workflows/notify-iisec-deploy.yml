name: Request DeadlineChain deployment

on:
  push:
    branches:
      - main
    # 静的サイトの生成結果に影響する変更だけを公開サイトへ通知する。
    # README、GitHub Actions 設定、開発用設定だけの変更は通知しない。
    paths:
      - 'pages/**'
      - 'src/**'
      - 'styles/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'next-env.d.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  request-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate conference JSON
        run: node --input-type=module --eval "JSON.parse(await (await import('node:fs/promises')).readFile('public/conference.json', 'utf8'));"

      - name: Request deployment in iisec-suzaki.github.io
        env:
          TOKEN: ${{ secrets.IISEC_SUZAKI_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iisec-suzaki/iisec-suzaki.github.io/dispatches \
            --data "{\"event_type\":\"deadlinechain-updated\",\"client_payload\":{\"sha\":\"${SHA}\"}}"
            
